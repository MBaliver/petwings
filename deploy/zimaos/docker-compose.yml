name: petwings
services:
  petwings:
    image: nginx:1.27-alpine
    container_name: petwings
    restart: unless-stopped
    depends_on:
      - petwings-api
    ports:
      - target: 80
        published: "8099"
        protocol: tcp
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - type: bind
        source: /DATA/AppData/petwings/www
        target: /usr/share/nginx/html
        read_only: true
      - type: bind
        source: /DATA/AppData/petwings/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    x-casaos:
      ports:
        - container: "80"
          description:
            en_us: Página do jogo (HTTP)
      volumes:
        - container: /usr/share/nginx/html
          description:
            en_us: Build web do PetWings (index.html, .js, .wasm, .data)
        - container: /etc/nginx/conf.d/default.conf
          description:
            en_us: Configuração do nginx (gzip, tipos MIME, cache)
  petwings-api:
    image: python:3.12-alpine
    container_name: petwings-api
    restart: unless-stopped
    user: "999:1000"
    command: ["python", "-u", "/app/server.py"]
    environment:
      TZ: America/Sao_Paulo
      PETWINGS_DB: /data/ranking.sqlite3
    volumes:
      - type: bind
        source: /DATA/AppData/petwings/api
        target: /app
        read_only: true
      - type: bind
        source: /DATA/AppData/petwings/data
        target: /data
    x-casaos:
      volumes:
        - container: /app
          description:
            en_us: Código do servidor do ranking (server.py)
        - container: /data
          description:
            en_us: Banco do ranking compartilhado (ranking.sqlite3)
x-casaos:
  architectures:
    - amd64
    - arm64
  main: petwings
  author: mojave
  developer: Saito Games (port por Claude Code)
  category: Games
  title:
    en_us: PetWings
  tagline:
    en_us: Shooter arcade de 1999, no navegador
  description:
    en_us: "Source port do PetWings 1.3 (Saito Games, freeware) para navegador, desktop e celular. Teclado, gamepad e toque. Arquivos em /DATA/AppData/petwings. Na rede local: https://petwings.mojavelabs.cloud (NPM -> porta 8099). Ranking compartilhado em /DATA/AppData/petwings/data."
  icon: https://petwings.mojavelabs.cloud/icon-512.png
  hostname: petwings.mojavelabs.cloud
  index: /
  port_map: "443"
  scheme: https
