# PetWings web build - static files
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/javascript application/wasm application/octet-stream application/manifest+json;  # text/html is always compressed

    # file names don't change between builds: always revalidate (cheap 304 when unchanged)
    add_header Cache-Control "no-cache" always;

    # shared ranking API (container petwings-api); resolved per request so nginx starts even
    # if the API container is still starting
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://petwings-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4k;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # the stock mime.types already has .wasm; only the PWA manifest needs a type
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }
}
